歩行と突進現象です。", "page": 4, "multi": true}, {"cat": "可動域", "q": "距腿関節の可動域について正しいのはどれか。2つ選べ。", "opts": ["底屈45°", "外転20°", "底屈10°", "内転10°", "背屈20°"], "ans": [0, 4], "exp": "PDFの設問は底屈45°・背屈20°を選ぶ形式です。", "page": 6, "multi": true}, {"cat": "MMT", "q": "MMT2（poor）に該当するのはどれか。", "opts": ["強い抵抗でも全可動域", "抵抗なしで重力に抗して全可動域", "重力を除去すれば全可動域", "筋収縮のみで関節運動なし", "筋収縮なし"], "ans": [2], "exp": "MMT2は重力除去位で全可動域を動かせる段階です。", "page": 6, "multi": false}, {"cat": "MMT", "q": "筋の収縮はみられるが、関節運動が生じない段階はどれか。", "opts": ["5（正常）", "4（優）", "3（良）", "2（可）", "1（不可）"], "ans": [4], "exp": "MMT1は筋収縮を触知・視認できるものの関節運動は生じません。", "page": 6, "multi": false}, {"cat": "歩行", "q": "歩行率とはどれか。", "opts": ["一方の踵接地から他方の踵接地まで", "同側の踵接地間の距離", "対側との踵接地間の距離", "単位時間当たりの歩数", "進行方向と足部長軸の角度"], "ans": [3], "exp": "歩行率（cadence）は単位時間当たりの歩数です。", "page": 7, "multi": false}, {"cat": "材料", "q": "金属と比較したプラスチック材料の一般的性質で誤っているのはどれか。", "opts": ["熱に弱い", "熱伝導率が高い", "紫外線により劣化しやすい", "成型しやすい", "加工の精度が低い"], "ans": [1], "exp": "一般にプラスチックは金属より熱伝導率が低い材料です。", "page": 9, "multi": false}, {"cat": "材料", "q": "ソケット積層材としてカーボン繊維を使う理由として適切な組合せはどれか。", "opts": ["高弾性・高強度", "高弾性・高断熱性", "高強度・高剛性", "高剛性・高通気性", "高通気性・高断熱性"], "ans": [2], "exp": "カーボン繊維は高強度・高剛性を得る目的で用いられます。", "page": 9, "multi": false}, {"cat": "材料", "q": "ポリプロピレンで誤っているのはどれか。", "opts": ["比重はプラスチックの中で小さい", "半透明である", "低温下で衝撃に強い", "耐アルカリ性に優れる", "繰り返しの曲げに強い"], "ans": [2], "exp": "ポリプロピレンは低温では耐衝撃性が低下しやすい材料です。", "page": 9, "multi": false}, {"cat": "材料", "q": "熱可塑性プラスチックシートによる義肢ソケットの成形方法で正しいのはどれか。", "opts": ["圧縮成形", "押出成形", "射出成形", "真空成型", "中空成形"], "ans": [3], "exp": "加熱軟化したシートをモデル上で真空成形する方法が用いられます。", "page": 9, "multi": false}, {"cat": "材料", "q": "PVA（ポリビニルアルコール）について正しいのはどれか。2つ選べ。", "opts": ["融点が低い", "弾性が高い", "親水性である", "熱硬化性である", "接着剤として利用される"], "ans": [2, 4], "exp": "PVAは親水性を持ち、接着剤などにも利用されます。", "page": 10, "multi": true}, {"cat": "材料", "q": "材料の厚みを増やすとどうなるか。", "opts": ["剛性は増加する", "凸面は圧縮・凹面は引張", "引張で半径は増加", "中空円筒は同外径の円柱より剛性大", "アルミ合金はステンレスより剛性大"], "ans": [0], "exp": "一般に同一材料・形状条件では厚みを増すと曲げ剛性は増加します。", "page": 10
